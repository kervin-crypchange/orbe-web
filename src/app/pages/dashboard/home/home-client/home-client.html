<div class="grid grid-cols-3 gap-4" [style.height]="availHeight+ 'px'">
    <div class="flex flex-col bg-white p-4 rounded-lg shadow-md gap-2 overflow-y-auto">
        <h5>Asesores</h5>
        @for (item of resource.value()!.results; track $index) {
        <ng-container [ngTemplateOutlet]="advisor" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>

        }
    </div>
    <div class="col-span-2 bg-white p-4 rounded-lg shadow-md">
        <h5>Chat</h5>
    </div>
</div>


<ng-template #advisor let-user>
    <div
        class="flex items-center gap-3 p-3 bg-white rounded-lg border border-gray-300 shadow-sm hover:shadow-md transition-shadow cursor-pointer">
        <div class="avatar avatar-online-bottom">
            <div class="size-10 rounded-full">
                <img [src]="user.avatar" [alt]="user.name" />
            </div>
        </div>

        <!-- Info del Usuario -->
        <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-medium text-gray-800 truncate">
                    {{ user.advisor.alias }}
                </h3>
            </div>

            <!-- Metadata -->
            <div class="flex items-center text-[11px] text-gray-400 mt-0.5">
                <span>{{ user.advisor.category }}</span>
            </div>
        </div>

        <span class="flex items-center text-gray-800 text-sm">
            {{user.rateAvg}}
            <span class="icon-[tabler--star-filled] size-4.5 text-yellow-300 ms-1"></span>
        </span>

    </div>
</ng-template>
